<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calificación – English Checkpoint Stage 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --card:#FFFFFF; --ink:#1C2B4A; --soft:#56627A; --line:#CBD5E4; --rule:#DDE5F1;
  --pen:#C2303C; --blue:#2447A8; --on-blue:#FFFFFF; --hl:#FFE45C; --hl-ink:#1C2440;
  --ok:#1D8556; --ok-bg:#E2F3EA; --warn:#9A6200; --warn-bg:#FFF2D6; --bad-bg:#FBE5E7;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111A28; --card:#18243A; --ink:#E4EAF6; --soft:#A2AEC4; --line:#31415D; --rule:#25344D;
  --pen:#FF8790; --blue:#8FB0FF; --on-blue:#0E1626; --hl:#5C5221; --hl-ink:#FFF4C4;
  --ok:#5CD89C; --ok-bg:#163527; --warn:#F2C35B; --warn-bg:#3A2E12; --bad-bg:#3A1E25; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#111A28; --card:#18243A; --ink:#E4EAF6; --soft:#A2AEC4; --line:#31415D; --rule:#25344D;
  --pen:#FF8790; --blue:#8FB0FF; --on-blue:#0E1626; --hl:#5C5221; --hl-ink:#FFF4C4;
  --ok:#5CD89C; --ok-bg:#163527; --warn:#F2C35B; --warn-bg:#3A2E12; --bad-bg:#3A1E25; color-scheme: dark; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:14px 14px 60px}
h1,h2,h3,.hand{font-family:"Kalam","Chalkboard SE","Comic Sans MS",cursive;color:var(--pen);font-weight:700;line-height:1.15}
h1{font-size:2.1rem;margin:10px 0 4px} h2{font-size:1.45rem;margin:0 0 8px} h3{font-size:1.2rem;margin:0 0 6px}
p{margin:0 0 10px} .muted{color:var(--soft)}
button,input,textarea,select{font:inherit;color:inherit}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.btn{appearance:none;border:none;border-radius:10px;padding:13px 18px;min-height:50px;background:var(--blue);color:var(--on-blue);font-weight:700;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{min-height:40px;padding:8px 12px;font-size:.92rem}
.btn:disabled{opacity:.45}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.field,textarea{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card)}
textarea{resize:vertical;line-height:30px;padding:2px 12px 8px;
  background-image:linear-gradient(transparent 29px,var(--rule) 29px,var(--rule) 30px);background-size:100% 30px;background-attachment:local}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.hidden{display:none!important}
.sheet-wrap{position:fixed;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-wrap .card{width:100%;max-width:640px;max-height:82vh;overflow:auto;margin:0}
.lines{font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem;line-height:1.55}
.ln{display:grid;grid-template-columns:2.2em 1fr;gap:6px;min-height:1.55em}
.ln .no{color:var(--soft);font-family:"Atkinson Hyperlegible",sans-serif;font-size:.78rem;text-align:right;padding-top:.25em}
.ln.head .tx{font-weight:700}
.ln.mark{background:var(--hl);color:var(--hl-ink);border-radius:4px}
.ln.mark .no{color:var(--hl-ink)}
.sep{text-align:center;letter-spacing:.4em;color:var(--soft)}
.gloss{font-size:.9rem;color:var(--soft);border-top:1.5px dashed var(--line);margin-top:12px;padding-top:8px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

.sum{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin:0 -14px;padding:10px 14px;border-bottom:1.5px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.sumrow div{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 4px}
.sumrow b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.sumrow span{font-size:.8rem;color:var(--soft)}
.big{font-family:"Kalam",cursive;color:var(--pen);font-size:3.4rem;line-height:1;font-weight:700}
.level{display:inline-block;background:var(--hl);color:var(--hl-ink);border-radius:999px;padding:4px 12px;font-weight:700;margin-top:6px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.item .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.qn{font-family:"Kalam",cursive;color:var(--pen);font-weight:700;font-size:1.15rem}
.tag{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.auto{background:var(--ok-bg);color:var(--ok)} .tag.rev{background:var(--warn-bg);color:var(--warn)}
.ans{background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.ans.empty{color:var(--soft);font-style:italic}
.key{font-size:.92rem;color:var(--soft)}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg button{min-width:48px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.seg button.on{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.seg button.sugg:not(.on){border-style:dashed;border-color:var(--blue)}
.wtext{white-space:pre-wrap;font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem;line-height:1.6;background:var(--bg);border-radius:10px;padding:12px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stats span{background:var(--bg);border-radius:999px;padding:3px 10px;font-size:.85rem}
.crit{border-top:1.5px dashed var(--line);padding-top:10px;margin-top:12px}
.desc{font-size:.92rem;color:var(--soft);margin-top:6px}
details summary{cursor:pointer;font-weight:700;color:var(--blue);padding:6px 0}
.hist button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);margin-top:8px;cursor:pointer}
</style></head>

<script>
const DATA = {"papers": [{"id": 1, "title": "Paper 1 – Non-fiction", "short": "Non-fiction", "texts": [{"key": "A", "name": "Text A", "intro": "", "lines": ["Stargazing* nights for families", "", "Dark skies, dazzling stars and a deep, quiet calm:", "stargazing is simply the most magical way to spend a", "night! Our observatory, which sits high in the hills, is", "the perfect place to begin. But with so many choices, how", "do you pick the right night for your family? Read on.", "", "When should we come?", "The sky is darkest around the new moon, when even faint", "stars can be seen. If you would rather look at the Moon", "itself, choose a night close to the full moon – its craters", "look amazing through a telescope*. Clear nights are best,", "so always check the weather before you travel.", "", "How long should we stay?", "Our short session lasts one hour and is ideal for younger", "children. If your family is keen to get stuck in, book the", "all-night ‘Sky Marathon’ instead. Hopping from telescope to", "telescope until sunrise is thrilling but tiring!", "", "What should we bring?", "Warm clothes are essential: nights in the hills can be", "freezing. You might also want to bring a blanket and a flask", "of hot chocolate. However, please leave bright torches at", "home, because they make it harder for everyone’s eyes to", "get used to the dark.", "", "Who will help us?", "Our friendly guides know the night sky like the back of", "their hand. Don’t be shy – ask them anything!"], "heads": [1, 9, 16, 22, 29], "glossary": ["*stargazing: looking at the stars and planets at night", "*telescope: an instrument that makes faraway objects look bigger and closer"]}, {"key": "B", "name": "Text B", "intro": "", "lines": ["Caroline Herschel: the comet hunter", "", "Most people have heard of famous astronomers*, but fewer", "know about Caroline Herschel – a singer who became one of", "the greatest comet hunters in history!", "", "Caroline was born in Germany in 1750. As a girl, she was", "expected to cook and clean rather than study. Despite this,", "she astonishingly went on to discover eight comets*.", "", "In 1772, Caroline moved to England to live with her brother", "William, a music teacher. At first, she trained as a singer.", "Soon, however, William became obsessed with the night sky.", "He taught Caroline mathematics, and together they built", "their own telescopes in the house.", "", "In 1781, a new planet – Uranus – was discovered by William.", "The King was so impressed that he paid William to work as an", "astronomer. Six years later, Caroline was given a salary of", "her own: she was the first woman ever to be paid as a scientist!", "", "Today, a comet and a crater on the Moon are named after her.", "She lived until she was ninety-seven, and she never stopped", "loving the stars."], "heads": [1], "glossary": ["*astronomer: a scientist who studies stars and planets", "*comet: a ball of ice and dust that travels around the Sun"]}], "sections": [{"intro": "Read Text A, in the insert, and answer Questions 1–7.", "qs": [{"id": "1a", "n": "1", "pre": "Look at lines 3–7.", "ref": ["A", 3, 7], "p": "(a) Look at line 3: ‘Dark skies, dazzling stars and a deep, quiet calm’. Name the figurative language technique the writer uses here.", "type": "text", "m": 1, "k": {"re": ["all?it+[ie]?r?at"], "note": "Alliteration (aliteración). Acepta la palabra mal escrita si se reconoce."}}, {"id": "1b", "ref": ["A", 3, 7], "p": "(b) Give one opinion from this section.", "type": "text", "m": 1, "k": {"re": ["magical", "perfect place"], "note": "‘stargazing is simply the most magical way to spend a night’ o ‘the perfect place to begin’."}}, {"id": "1c", "ref": ["A", 3, 7], "p": "(c) Give one example of a relative pronoun.", "type": "text", "m": 1, "k": {"re": ["\\bwhich\\b"], "note": "which (línea 5). Si copia una frase larga, solo vale si señala la palabra."}}, {"id": "2", "n": "2", "pre": "Look at lines 16–20.", "ref": ["A", 16, 20], "p": "Find a short phrase which means to start doing something with a lot of energy.", "type": "text", "m": 1, "k": {"re": ["stuck in"], "note": "(to) get stuck in."}}, {"id": "3a", "n": "3", "pre": "Look at lines 9–14.", "ref": ["A", 9, 14], "p": "(a) What punctuation mark could replace the dash ( – ) in line 12?", "type": "text", "m": 1, "k": {"re": ["(?<!semi)colon"], "note": "A colon (dos puntos). Tiene que nombrarlo, no basta con dibujar el signo."}}, {"id": "3b", "ref": ["A", 16, 20], "p": "(b) Look at lines 19–20. Explain the meaning of the phrase ‘Hopping from telescope to telescope’.", "type": "text", "m": 2, "k": {"groups": [["quick", "fast", "hurr", "rush", "energ", "jump"], ["one.*(to|next|another|other)", "from.*to", "different", "many", "each", "all the", "lots of"]], "note": "1 punto: idea de moverse rápido/con energía. 1 punto: idea de pasar de un telescopio a otro."}}, {"id": "4", "n": "4", "p": "You are booking a stargazing night. Would you prefer the short session or the ‘Sky Marathon’? Tick one box. Explain your choice giving evidence from the text.", "type": "choice", "o": ["I would prefer the short session", "I would prefer the Sky Marathon"], "f": ["Reason for your choice:", "Evidence from the text:"], "m": 2, "k": {"chain": true, "by": {"I would prefer the short session": [["tired", "relax", "young", "short", "sleep", "easy", "less", "not.*long", "bored"], ["one hour", "ideal for younger", "tiring"]], "I would prefer the Sky Marathon": [["excit", "thrill", "more", "fun", "sunrise", "whole night", "all night", "long"], ["thrilling", "until sunrise", "all-night", "all night", "stuck in"]]}, "note": "La razón debe ser con sus palabras y coincidir con la casilla. Si la razón vale 0, la evidencia también vale 0. Corta: más descansada/para niños pequeños + ‘one hour… ideal for younger children’. Marathon: más emocionante + ‘thrilling’ / ‘until sunrise’ (si añade ‘tiring’ no vale la evidencia)."}}, {"id": "5a", "n": "5", "pre": "Look at lines 22–27.", "ref": ["A", 22, 27], "p": "(a) ‘On the other hand’ is often used to introduce an opposite idea. Which word is used in the same way in this section?", "type": "text", "m": 1, "k": {"re": ["however"], "note": "However."}}, {"id": "5b", "ref": ["A", 22, 27], "p": "(b) Look at line 24. Why has the modal verb ‘might’ been used here?", "type": "text", "m": 1, "k": {"re": ["possib", "option", "not (have|need) to", "don.?t have to", "not definite", "not sure", "maybe", "choice", "choose", "not essential", "not necessary", "if you want"], "note": "Idea de posibilidad u opción: no es obligatorio llevarlo."}}, {"id": "6", "n": "6", "p": "The text is structured in different ways to make the information easy to read. Give two of the ways.", "type": "two", "f": ["•", "•"], "m": 2, "k": {"pool": [["heading", "title", "subtitle"], ["question"], ["paragraph"], ["glossary"], ["space", "gap", "line break", "sections"]], "note": "Subtítulos/headings, subtítulos en forma de pregunta, párrafos cortos, espacios entre párrafos, glosario. Un punto por cada forma distinta."}}, {"id": "7", "n": "7", "p": "Where do you think you would find a text like this? Tick one box.", "type": "mc", "o": ["A school science textbook", "A leaflet from an observatory", "A dictionary", "A newspaper report"], "m": 1, "k": {"a": "A leaflet from an observatory", "note": "Leaflet from an observatory (texto persuasivo/informativo para visitantes)."}}]}, {"intro": "Read Text B, in the insert, and answer Questions 8–13.", "qs": [{"id": "8a", "n": "8", "pre": "Look at lines 7–9.", "ref": ["B", 7, 9], "p": "(a) Find an adverb which shows that the writer is surprised by what Caroline did.", "type": "text", "m": 1, "k": {"re": ["astonish"], "note": "astonishingly."}}, {"id": "8b", "ref": ["B", 7, 9], "p": "(b) Which word in line 8 shows that Caroline succeeded even though things were difficult for her?", "type": "text", "m": 1, "k": {"re": ["despite"], "note": "Despite."}}, {"id": "9a", "n": "9", "pre": "Look at lines 17–20.", "ref": ["B", 17, 20], "p": "(a) What is the purpose of the dashes ( – ) in line 17? Tick one box.", "type": "mc", "o": ["to add a detail", "to add a meaning", "to add a comment", "to add an explanation"], "m": 1, "k": {"a": "to add a detail", "note": "to add a detail (el nombre del planeta)."}}, {"id": "9b", "ref": ["B", 17, 20], "p": "(b) Give one example of a passive verb form from this section.", "type": "text", "m": 1, "k": {"re": ["was discovered", "was given", "be paid"], "note": "was discovered / was given / (to) be paid. ‘was’ o ‘discovered’ solos no valen."}}, {"id": "9c", "ref": ["B", 17, 20], "p": "(c) Why has a colon ( : ) been used in line 20?", "type": "text", "m": 1, "k": {"re": ["explain", "explanation", "more information", "more detail", "why", "introduce", "tell(s)? (us )?more", "what"], "note": "Para introducir una explicación / más información sobre el salario de Caroline."}}, {"id": "10", "n": "10", "pre": "Look at line 22.", "ref": ["B", 22, 24], "p": "The text is mainly in the past tense. Why is the present tense used in line 22?", "type": "text", "m": 1, "k": {"re": ["still", "today", "now", "true", "fact", "present"], "note": "Porque sigue siendo verdad hoy (el cometa y el cráter todavía llevan su nombre)."}}, {"id": "11a", "n": "11", "p": "(a) The writer uses adverbial phrases to help structure the text. Give one example of a three-word adverbial phrase of place.", "type": "text", "m": 1, "k": {"re": ["in the house", "on the moon"], "note": "in the house (línea 15) / on the Moon (línea 22)."}}, {"id": "11b", "p": "(b) Give one example of an adverbial phrase of time which introduces a new paragraph.", "type": "text", "m": 1, "k": {"re": ["1772", "1781", "today"], "note": "In 1772 / In 1781 / Today. (‘At first’ y ‘Six years later’ no abren párrafo.)"}}, {"id": "12", "n": "12", "p": "Text B is a biographical text. Give one feature of a biography used in Text B.", "type": "text", "m": 1, "k": {"re": ["date", "year", "real", "life", "past tense", "chronolog", "order", "third person", "facts? about", "born", "died", "true story"], "note": "Rasgo general de biografía: persona real, fechas importantes, orden cronológico, tercera persona, pasado. Mencionar solo a Caroline sin un rasgo general no vale."}}, {"id": "13", "n": "13", "p": "Which two themes occur throughout Text B? Tick two boxes.", "type": "multi", "o": ["the night sky", "cooking and cleaning", "working hard to succeed", "kings and queens", "singing lessons"], "m": 2, "k": {"a": ["the night sky", "working hard to succeed"], "note": "the night sky + working hard to succeed. 0 si marca más de dos."}}]}], "writing": {"n": "14", "task": "Your school is starting a new after-school club, but not many students have joined yet. Write a persuasive text for the school website to make more students want to join.", "list": ["an astronomy club", "a robotics club", "a football club", "a drama club", "a cooking club", "a club of your choice"], "listIntro": "The club could be:", "after": "Remember to use the features of persuasive writing.", "kind": "persuasive"}}, {"id": 2, "title": "Paper 2 – Fiction", "short": "Fiction", "texts": [{"key": "T", "name": "Text", "intro": "Text for Section A. Isla and her father have travelled to a small island. Gran looks after the lighthouse there, and she needs their help.", "lines": ["Isla pressed her forehead against the cold glass and stared", "at the grey sea, the way a sailor stares at a storm he means", "to beat. The little ferry* groaned and rolled beneath her feet.", "Her father had gone below an hour ago, his face as green as", "the waves, and all the other passengers had done the same.", "", "But Isla did not want to miss a single thing.", "", "She crept out of the cabin and onto the slippery deck, her", "scarf whipping around her face. Then, through the drizzle,", "the island appeared. On its highest cliff stood the", "lighthouse, tall and white and proud, watching over the", "water like an old soldier who refused to sleep.", "******", "By the time they had climbed the cliff path, the sun was", "sinking. A horse and cart had carried their trunk* as far as", "the gate; after that, Father carried it himself, puffing.", "Gran was waiting in the doorway. She was holding Father’s", "letter so close to her face that it almost touched her nose.", "‘It looks … smaller than I remembered,’ Isla whispered.", "‘Everything looks smaller when you grow,’ said Gran, and she", "laughed – a little too loudly. ‘Now, come inside before the", "wind steals you away!’", "As they stepped into the kitchen, Gran missed the last step", "and grabbed the door frame.", "‘Silly old step,’ she muttered. ‘It moves every winter.’", "******", "That night, Isla could not sleep. The oil lamp beside her", "bed flickered, throwing jumpy shadows onto the ceiling.", "Through her window, she could see the lighthouse – and its", "lamp was dark.", "She pulled on her boots and tiptoed down the stairs. In the", "kitchen, Father and Gran were talking in low voices.", "‘You can’t keep climbing those steps every night, Mother,’", "Father was saying. ‘Not when you can’t even read my letters.’", "‘And who else will do it?’ said Gran. ‘The ships need that", "light.’", "Isla slipped out of the back door. The wind tugged at her", "coat, but she did not stop until she reached the bottom of", "the lighthouse. One hundred and twelve steps spiralled up", "into the darkness above her.", "She took a deep breath, gripped the cold iron rail and began", "to climb."], "heads": [], "glossary": ["*ferry: a boat that carries people across a short stretch of water", "*trunk: a large, strong box for carrying clothes on a long journey"]}], "sections": [{"intro": "Read the Text in the insert, and answer Questions 1–17.", "qs": [{"id": "1", "n": "1", "pre": "Look at the first section (lines 1–13).", "ref": ["T", 1, 5], "p": "Where is Isla?", "type": "text", "m": 1, "k": {"re": ["ferry", "boat", "ship", "sea", "cabin", "deck"], "note": "On a ferry / a boa function fromB64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function unpack(code){
  code=code.trim(); const h=code.indexOf("#"); if(h>=0) code=code.slice(h+1);
  const bytes=fromB64u(code.slice(1));
  if(code[0]==="z"){ const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return JSON.parse(await new Response(ds).text()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
const norm = s => String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ");
const hit = (txt, res) => res.some(r=>new RegExp(r,"i").test(norm(txt)));

function auto(q,a){
  const k=q.k;
  if(q.type==="mc") return a===k.a?1:0;
  if(q.type==="multi"){ const s=a||[]; if(s.length>k.a.length) return 0; return Math.min(q.m, s.filter(x=>k.a.includes(x)).length); }
  if(q.type==="text"){ if(!a||!a.trim()) return 0; if(k.groups) return Math.min(q.m,k.groups.filter(g=>hit(a,g)).length); return hit(a,k.re)?1:0; }
  if(q.type==="two"){ const v=a||[]; if(k.per) return v.filter((x,i)=>x&&k.per[i]&&hit(x,k.per[i])).length;
    const used=new Set(); let n=0; v.forEach(x=>{ if(!x) return; const gi=k.pool.findIndex((g,i)=>!used.has(i)&&hit(x,g)); if(gi>=0){used.add(gi);n++;} }); return Math.min(q.m,n); }
  if(q.type==="choice"){ if(!a||!a.c) return 0; const by=k.by[a.c]; if(!by) return 0; const f=a.f||[];
    if(q.f.length===1) return f[0]&&hit(f[0],by[0])?1:0;
    const r = f[0]&&hit(f[0],by[0])?1:0; const e = f[1]&&hit(f[1],by[1])?1:0; return k.chain ? (r? r+e : 0) : r+e; }
  return 0;
}
function fmt(q,a){
  if(q.type==="text") return a&&a.trim()?esc(a):null;
  if(q.type==="mc") return a?"☑ "+esc(a):null;
  if(q.type==="multi") return a&&a.length?a.map(x=>"☑ "+esc(x)).join("\n"):null;
  if(q.type==="two"){ const v=a||[]; return v.some(x=>x&&x.trim())?q.f.map((f,i)=>`${esc(f)} ${esc(v[i]||"—")}`).join("\n"):null; }
  if(q.type==="choice"){ if(!a||(!a.c&&!(a.f||[]).some(Boolean))) return null; return `☑ ${esc(a.c||"(sin casilla)")}\n`+q.f.map((f,i)=>`${esc(f)} ${esc((a.f||[])[i]||"—")}`).join("\n"); }
}

function start(){
  const code=location.hash.slice(1);
  if(code){ unpack(code).then(open).catch(()=>pasteScreen("No pude leer ese link. Revisa que esté completo.")); }
  else pasteScreen("");
}

}

function open(sub){
  SUB=sub; PAPER=DATA.papers.find(p=>p.id===sub.paper);
  const g=G(); GR=g[sub.id]||{marks:{},rub:{}}; GR.sub=sub;
  const qs=PAPER.sections.flatMap(s=>s.qs);
  qs.forEach(q=>{ if(GR.marks[q.id]==null) GR.marks[q.id]=auto(q,sub.ans[q.id]); });
  render();
}
function totals(){
  const qs=PAPER.sections.flatMap(s=>s.qs);
  const r=qs.reduce((s,q)=>s+(GR.marks[q.id]||0),0);
  const wc=words(SUB.w); let w=RUB.reduce((s,c)=>s+(GR.rub[c.k]||0),0);
  let cap=""; if(wc<=20){w=0;cap="20 palabras o menos: el writing vale 0.";} else if(wc<=60&&w>7){w=7;cap="Entre 21 y 60 palabras: máximo 7 puntos.";}
  const graded=RUB.every(c=>GR.rub[c.k]!=null);
  return {r,w,t:r+w,cap,graded};
}
function level(p){ return LEVELS.find(([m])=>p>=m)[1]; }

  const capEl=document.getElementById("cap"); if(capEl) capEl.textContent=T.cap;
}

   ${RUB.map(c=>`<div class="crit"><b>${esc(c.n)}</b> <span class="key">(0–${c.max})</span>
    <div class="seg" data-r="${c.k}">${Array.from({length:c.max+1},(_,i)=>`<button class="${GR.rub[c.k]===i?"on":""}" data-v="${i}">${i}</button>`).join("")}</div>
    <div class="desc" id="d_${c.k}">${GR.rub[c.k]!=null?esc(c.d[GR.rub[c.k]]):"Toca un número. Empieza por el nivel más bajo y sube mientras el texto cumpla la descripción."}</div></div>`).join("")}
  </div>
  <div class="row" style="margin-top:16px;flex-direction:column"><button class="btn" id="copy">Copiar resumen</button><button class="btn ghost" id="other">Calificar otra prueba</button></div>
  <p class="muted" id="msg" style="margin-top:8px"></p>`;
  app.querySelectorAll(".seg[data-q] button").forEach(b=>b.onclick=()=>{ const s=b.parentElement; GR.marks[s.dataset.q]=+b.dataset.v; s.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); updateSum(); });
  app.querySelectorAll(".seg[data-r] button").forEach(b=>b.onclick=()=>{ const s=b.parentElement, c=RUB.find(x=>x.k===s.dataset.r); GR.rub[c.k]=+b.dataset.v; s.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); document.getElementById("d_"+c.k).textContent=c.d[+b.dataset.v]; updateSum(); });
  document.getElementById("copy").onclick=async()=>{ const T=totals(); const lost=qs.filter(q=>(GR.marks[q.id]||0)<q.m).map(q=>q.id).join(", ");
    const t=`${SUB.name} – English ${PAPER.title}\nReading: ${T.r}/25\nWriting: ${T.graded?T.w+"/25":"sin calificar"}\nTotal: ${T.graded?T.t+"/50 ("+Math.round(T.t/50*100)+"%)":"—"}\nPreguntas para repasar: ${lost||"ninguna"}`;
    try{ await navigator.clipboard.writeText(t); document.getElementById("msg").textContent="Resumen copiado."; }catch(e){ document.getElementById("msg").textContent=t; } };
  document.getElementById("other").onclick=()=>{ history.replaceState(null,"",location.pathname); pasteScreen(""); };
  updateSum(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",start);
start();
</script></body></html>
